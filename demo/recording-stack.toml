# The demo recording stack — the goals worth paying for.
#
# Read `scripts/record_demo_batch.py --list` for a rendered view of this file.
#
# Two axes decide what belongs here, because a portfolio reviewer is judging the *loop*,
# not any single answer:
#
#   1. Intent coverage. `AnalysisIntent` (trend, comparison, correlation, anomaly,
#      distribution, ranking, association, profile) is what the goal interpreter resolves a
#      question to, and it drives which experiments become candidates. Goals spread across
#      intents make the planner visibly select different tool mixes — that is the README's
#      "the mix shifts by goal" claim, demonstrated instead of asserted.
#
#   2. Outcome coverage. supported / rejected / mixed / insufficient_evidence. A set where
#      everything concludes cleanly looks like a demo rig. The runs where a claim is
#      overturned, or where the loop declines, are the ones that show the invariant is real.
#
# IMPORTANT — outcomes cannot be commissioned. A real model decides, so `expect` below is
# what the goal is *aimed* at, never a promise. Over-record deliberately, then publish the
# subset that covers the outcome space. Curating which runs to publish is honest; editing a
# run is not.
#
# ---------------------------------------------------------------------------------------
# What the first full sweep taught us (2026-08-19, 8 goals, $0.044)
#
# **Phrase every goal as two competing explanations.** The three goals shaped
# "A, or is B the explanation?" produced 7-13 evidence items over 3-7 experiments with
# multiple hypotheses and real critiques. The five shaped as a single question
# ("which region is weakest?", "were there anomalous months?") produced *one* hypothesis,
# one or two experiments, and ended `unresolved` at confidence 0.2 — runs that read as the
# loop giving up rather than as rigour.
#
# The mechanism is documented in the prompt changelog: intent hard-gates the candidate
# tools, so a narrow single-question intent can leave the planner with one experiment and a
# premature stop. A goal naming two accounts forces at least two hypotheses, which keeps
# candidates alive across iterations.
#
# This is the opposite of the caution recorded before that sweep, which guessed that "or"
# framing was the risky one because it can produce mutually exclusive claims. It can — and
# that is now caught by the contradiction check in the critic, which turns the risk into
# the most interesting trace in the set.
# ---------------------------------------------------------------------------------------
#
# `slug` is only used when publishing, and publishing is always an explicit second step.

[[recording]]
id = "csv-delivery-delays"
command = "csv"
slug = "csv-delivery-delays"
intent = "trend"
expect = "insufficient_evidence"
goal = "Delivery times in the north region have worsened. Is service quality actually degrading, or is rising order volume the explanation?"
why = """Already published and already the strongest asset in the set: it declines. Two
competing explanations, neither cleanly separable in 96 rows, so the loop stops at
insufficient_evidence rather than picking one. Keep it as the anchor."""

[[recording]]
id = "csv-staffing-vs-service"
command = "csv"
slug = "csv-staffing-vs-service"
intent = "correlation"
expect = "insufficient_evidence — the two drivers cannot be separated in this data"
goal = "Does staffing level explain on-time rate, or is order volume the stronger driver of service quality?"
why = """Published. The best trace in the set: both drivers find independent support, the
critic notices that the two claims are mutually exclusive, and the loop weakens both and
declines rather than picking one. 13 evidence items over 3 experiments. This is the run that
shows the system catching itself, which is worth more than any clean answer here."""

[[recording]]
id = "csv-regional-ranking"
command = "csv"
slug = "csv-regional-ranking"
intent = "ranking"
expect = "supported or weakened — a real gap, or one the workload explains"
goal = "The weakest region on on-time delivery: is that a genuine service-quality gap, or is it explained by the order volume that region carries?"
why = """Rewritten after the first sweep. "Which region is weakest?" produced a single
hypothesis, one rank_entities call and `unresolved` at 0.2 — a sorted list and a shrug.
Naming the alternative account (workload, not quality) forces a second hypothesis and keeps
compare_groups and effect_size alive as candidates after the ranking lands."""

[[recording]]
id = "csv-distribution-honesty"
command = "csv"
slug = "csv-distribution-honesty"
intent = "distribution"
expect = "mixed or weakened — which account the shape supports"
goal = "Our average delivery time has risen. Is that a broad shift affecting most orders, or is a small tail of very late orders dragging the mean up?"
why = """Rewritten after the first sweep, which produced one hypothesis and stopped at two
experiments. Broad-shift versus heavy-tail are two accounts of the same mean, distinguishable
only by looking at the distribution — so the goal is a question about the honesty of a
summary statistic, put to a system whose thesis is that no number is fabricated."""

[[recording]]
id = "csv-anomaly-months"
command = "csv"
slug = "csv-anomaly-months"
intent = "anomaly"
expect = "supported or weakened — a discrete break, or steady drift"
goal = "Did delivery performance break sharply in particular months, or has it drifted gradually the whole period with no real break at all?"
why = """Rewritten after the first sweep, which produced one hypothesis and `unresolved`.
Break-versus-drift is the sharpest pair available in this data: they predict different things
about the same series, detect_change_points and analyze_time_series_trend answer different
halves, and neither result alone settles it."""

[[recording]]
id = "edgar-margin-vs-growth"
command = "edgar"
slug = "edgar-margin-vs-growth"
tickers = "AAPL,MSFT,NVDA"
intent = "trend"
expect = "mixed — one hypothesis supported, one rejected"
goal = "Has margin quality deteriorated at these companies over recent periods, or is revenue growth the explanation?"
why = """Already published and the best trace in the set: h1 rejected at 0.05, the critic
challenges the surviving claim on distributional grounds, the loop runs the nominated tool
and only then reports h2 supported at 0.95. Re-record only if the export needs the model
calls this run predates."""

[[recording]]
id = "edgar-peer-separation"
command = "edgar"
slug = "edgar-peer-separation"
tickers = "AAPL,MSFT,NVDA"
intent = "comparison"
expect = "supported or weakened — a durable gap, or one growth accounts for"
goal = "Does NVDA's margin advantage over AAPL and MSFT reflect a durable difference in profitability, or is it explained by revenue growth outpacing theirs over the same periods?"
why = """Rewritten after the first sweep: the within-normal-variation framing produced one
hypothesis, one edgar_peer_comparison call and `unresolved` at 0.2. Naming growth as the
rival account gives the loop a second claim and a reason to bring
edgar_revenue_growth_analysis alongside the peer comparison. Live SEC data, so this also
proves the EDGAR path end to end."""

[[recording]]
id = "edgar-growth-breaks"
command = "edgar"
slug = "edgar-growth-breaks"
tickers = "AAPL,MSFT,NVDA"
intent = "anomaly"
expect = "mixed — likely different per company"
goal = "Where revenue growth appears to break trend at these companies, is that a genuine change in the business, or an artefact of quarterly seasonality in the filings?"
why = """Rewritten after the first sweep, which produced one hypothesis over four experiments
and still ended `unresolved`. Real-break versus seasonality is the rival pair that actually
threatens the finding, and it is the one a finance reviewer would raise first. Three entities
mean the honest answer may differ per company, which is hard to fake."""

# ---------------------------------------------------------------------------------------
# Deliberately NOT in the default set — enable with --include-known-limit.
#
# The README's first known limit is that on a question the data cannot answer, the model
# substitutes the nearest available metric and reports confidence 0.95. This goal is built
# to trigger exactly that. Publishing it would be the most honest thing on the site and the
# most damaging out of context, so it is opt-in and should ship only alongside the framing
# that it is a documented model failure the loop does not catch.
[[recording]]
id = "csv-unanswerable-moat"
command = "csv"
optional = true
slug = "csv-unanswerable-moat"
intent = "general"
expect = "confidently wrong — this is the documented failure, not a bug to fix here"
goal = "Which region has the strongest customer loyalty?"
why = """Nothing in this dataset measures loyalty. The honest answer is that the question
cannot be answered from these columns. Recording it captures the documented weakness in the
same evidence format as everything else, which is worth more than describing it in prose."""
