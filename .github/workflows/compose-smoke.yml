name: Full Stack

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDGAR_BACKEND_JWT_SECRET: ci-jwt-secret-minimum-32-characters-123456
      EDGAR_BACKEND_BOOTSTRAP_ADMIN_TOKEN: ci-bootstrap-admin-token
      EDGAR_BACKEND_OPS_API_TOKEN: ci-ops-api-token
      EDGAR_SMOKE_ADMIN_EMAIL: smoke-admin@example.com
      EDGAR_SMOKE_ADMIN_PASSWORD: Smokepass12!
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start full stack
        run: docker compose up -d --build

      - name: Run secure-default smoke contract
        run: ./scripts/smoke-compose.sh

      - name: Seed deterministic browser fixture
        # Run as appuser (uid 1000) — the same user the api/worker serve as. The
        # local artifact store writes blobs mode 0600 (owner-only), so seeding as
        # root (docker compose exec default) would create root-owned blobs the
        # appuser API cannot read ("Could not read artifact from storage").
        run: |
          mkdir -p .tmp
          docker compose exec -T -u appuser \
            -e EDGAR_SMOKE_ADMIN_EMAIL="${EDGAR_SMOKE_ADMIN_EMAIL}" \
            -e EDGAR_SMOKE_ADMIN_PASSWORD="${EDGAR_SMOKE_ADMIN_PASSWORD}" \
            api python -m tests.support.seed_fullstack_browser_fixture > .tmp/e2e-fixture.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser regressions
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_FIXTURE_PATH: ${{ github.workspace }}/.tmp/e2e-fixture.json
        run: npm run test:e2e

      - name: Capture Compose diagnostics
        if: ${{ failure() || !cancelled() }}
        run: |
          mkdir -p .tmp
          docker compose ps > .tmp/compose-ps.txt || true
          docker compose logs --no-color > .tmp/compose.log || true

      - name: Upload browser and Compose diagnostics
        if: ${{ failure() || !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-diagnostics
          path: |
            .tmp/compose-ps.txt
            .tmp/compose.log
            .tmp/e2e-fixture.json
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
