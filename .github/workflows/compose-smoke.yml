name: Full Stack

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDGAR_BACKEND_JWT_SECRET: ci-jwt-secret-minimum-32-characters-123456
      EDGAR_BACKEND_BOOTSTRAP_ADMIN_TOKEN: ci-bootstrap-admin-token
      EDGAR_BACKEND_OPS_API_TOKEN: ci-ops-api-token
      EDGAR_SMOKE_ADMIN_EMAIL: smoke-admin@example.com
      EDGAR_SMOKE_ADMIN_PASSWORD: Smokepass12!
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start full stack
        run: docker compose up -d --build

      - name: Run secure-default smoke contract
        run: ./scripts/smoke-compose.sh

      - name: Capture Compose diagnostics
        if: failure()
        run: |
          mkdir -p .tmp
          docker compose ps > .tmp/compose-ps.txt || true
          docker compose logs --no-color > .tmp/compose.log || true

      - name: Upload Compose diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-diagnostics
          path: .tmp/
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
