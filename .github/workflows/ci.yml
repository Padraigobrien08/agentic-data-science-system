# Fast PR/push checks: backend pytest (SQLite/in-memory tests) + frontend lint + build.
# No Docker Compose or integration stack (see repo docs for local smoke).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking, and deliberately cheap: nothing else notices when the loose
  # requirements*.txt drift from the .lock files that Docker and CI actually install
  # from. Dependabot only ever raises floors in the loose files, so without this a
  # merged bump leaves a stale lock and CI stays green on the old pin.
  locks:
    name: Dependency locks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install checker dependency
        run: pip install --upgrade pip packaging

      - name: Check lockfiles satisfy the declared floors
        run: python3 scripts/check-lockfile-drift.py

  api-contract:
    name: API contract (OpenAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.lock
      # The committed schema is what makes an API change reviewable; fail if it is stale.
      - name: Check docs/api/openapi.json is in step with the app
        run: python3 scripts/export-openapi.py --check

  quality:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements.lock

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.lock

      # Blocking: ruff is kept green (see ruff.toml). New violations fail CI.
      - name: Ruff lint
        run: python -m ruff check .

      # Report-only for now: the backend is not yet mypy-clean (see mypy.ini / backlog E3).
      # Surfaces type findings without blocking merges; flip to blocking once burned down.
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy backend

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements.lock

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.lock

      # Coverage floor is 80% (baseline ~84%); ratchet upward toward baseline over time.
      - name: Run pytest (with coverage)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >
          python -m pytest tests/ -q --tb=short
          --cov=backend --cov=edgar_project --cov=src --cov=agentic
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=80

      - name: Coverage summary
        if: always()
        run: |
          echo '### Backend coverage' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
