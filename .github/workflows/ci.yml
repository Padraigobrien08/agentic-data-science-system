# Fast PR/push checks: backend pytest (SQLite/in-memory tests) + frontend lint + build.
# No Docker Compose or integration stack (see repo docs for local smoke).

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-backend.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.txt

      # Blocking: ruff is kept green (see ruff.toml). New violations fail CI.
      - name: Ruff lint
        run: python -m ruff check .

      # Report-only for now: the backend is not yet mypy-clean (see mypy.ini / backlog E3).
      # Surfaces type findings without blocking merges; flip to blocking once burned down.
      - name: Mypy (report-only)
        continue-on-error: true
        run: python -m mypy backend

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-backend.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -q --tb=short

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
