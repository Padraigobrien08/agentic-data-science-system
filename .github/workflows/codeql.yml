# Static analysis (SAST) via GitHub CodeQL — backlog E2.
# Findings surface as code-scanning alerts in the repo Security tab (non-blocking by design).
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly deep scan so alerts stay fresh on unchanged code (Mondays 07:00 UTC).
    - cron: "0 7 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Required for CodeQL to upload alerts.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
