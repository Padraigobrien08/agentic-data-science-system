# Local full-stack dev & test: Postgres → migrations → API + worker → frontend.
# Requires Docker Compose v2.20+ (`service_completed_successfully` for migrate).
#
# Quick start:
#   cp .env.example .env
#   # set EDGAR_BACKEND_JWT_SECRET, EDGAR_BACKEND_OPS_API_TOKEN,
#   # and EDGAR_BACKEND_BOOTSTRAP_ADMIN_TOKEN
#   docker compose up --build
#
# After changing backend Python code or env-backed behavior, rebuild API/worker images (recreate alone
# reuses the old image):  docker compose build api worker && docker compose up -d api worker
#
# The documented stack fails fast if required auth secrets are missing from `.env`.
#
# Startup order:
#   1. db (waits until healthy)
#   2. migrate (one-shot `alembic upgrade head`)
#   3. api + worker (parallel; same Postgres URL + shared artifact volume)
#   4. web (after api healthcheck passes; API_URL=http://api:8000)
#
# URLs: http://127.0.0.1:8000/v1/health   http://127.0.0.1:3000

name: edgar

x-backend-env: &backend_env
  EDGAR_BACKEND_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-edgar}:${POSTGRES_PASSWORD:-edgar}@db:5432/${POSTGRES_DB:-edgar}
  EDGAR_BACKEND_JWT_SECRET: ${EDGAR_BACKEND_JWT_SECRET:?set in .env}
  EDGAR_BACKEND_OPS_API_TOKEN: ${EDGAR_BACKEND_OPS_API_TOKEN:?set in .env}
  EDGAR_BACKEND_BOOTSTRAP_ADMIN_TOKEN: ${EDGAR_BACKEND_BOOTSTRAP_ADMIN_TOKEN:?set in .env}
  EDGAR_BACKEND_DEBUG: ${EDGAR_BACKEND_DEBUG:-false}
  EDGAR_BACKEND_ALLOW_OPEN_REGISTRATION: ${EDGAR_BACKEND_ALLOW_OPEN_REGISTRATION:-false}
  EDGAR_BACKEND_ALLOW_INSECURE_DEV_JWT: ${EDGAR_BACKEND_ALLOW_INSECURE_DEV_JWT:-false}
  EDGAR_BACKEND_ARTIFACT_STORAGE_ROOT: /var/lib/edgar/artifacts
  EDGAR_BACKEND_ARTIFACT_STORAGE_BACKEND: ${EDGAR_BACKEND_ARTIFACT_STORAGE_BACKEND:-local}
  EDGAR_BACKEND_ARTIFACT_STORAGE_S3_BUCKET: ${EDGAR_BACKEND_ARTIFACT_STORAGE_S3_BUCKET:-}
  EDGAR_BACKEND_ARTIFACT_STORAGE_S3_REGION: ${EDGAR_BACKEND_ARTIFACT_STORAGE_S3_REGION:-us-east-1}
  EDGAR_BACKEND_ARTIFACT_STORAGE_S3_PREFIX: ${EDGAR_BACKEND_ARTIFACT_STORAGE_S3_PREFIX:-}
  EDGAR_BACKEND_ARTIFACT_STORAGE_S3_ENDPOINT_URL: ${EDGAR_BACKEND_ARTIFACT_STORAGE_S3_ENDPOINT_URL:-}
  EDGAR_BACKEND_ARTIFACT_STORAGE_S3_ACCESS_KEY_ID: ${EDGAR_BACKEND_ARTIFACT_STORAGE_S3_ACCESS_KEY_ID:-}
  EDGAR_BACKEND_ARTIFACT_STORAGE_S3_SECRET_ACCESS_KEY: ${EDGAR_BACKEND_ARTIFACT_STORAGE_S3_SECRET_ACCESS_KEY:-}
  EDGAR_BACKEND_ARTIFACT_STORAGE_S3_FORCE_PATH_STYLE: ${EDGAR_BACKEND_ARTIFACT_STORAGE_S3_FORCE_PATH_STYLE:-false}
  EDGAR_BACKEND_RUN_WORKSPACE_ROOT: /var/lib/edgar/run_workspaces
  # LLM: set keys in repo-root `.env` then `docker compose up -d --force-recreate api worker`
  EDGAR_BACKEND_LLM_PROVIDER: ${EDGAR_BACKEND_LLM_PROVIDER:-off}
  EDGAR_BACKEND_OPENAI_API_KEY: ${EDGAR_BACKEND_OPENAI_API_KEY:-}
  # Common alternate name (also read by Settings if prefixed key is empty):
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  EDGAR_BACKEND_OPENAI_BASE_URL: ${EDGAR_BACKEND_OPENAI_BASE_URL:-}
  EDGAR_BACKEND_AGENT_COMPLETION_MODEL: ${EDGAR_BACKEND_AGENT_COMPLETION_MODEL:-gpt-5.4-mini}
  # Retention (payload compaction + artifact-blob pruning). The `retention` service applies these on a
  # schedule. The code default is 0/off (safe for dev, tests, and the CLI); the deployed stack enables
  # sensible windows here. Set any tier to 0 to disable it. See backend/maintenance/retention.py.
  EDGAR_BACKEND_RETENTION_RUN_PAYLOAD_DAYS: ${EDGAR_BACKEND_RETENTION_RUN_PAYLOAD_DAYS:-90}
  EDGAR_BACKEND_RETENTION_MODEL_PAYLOAD_DAYS: ${EDGAR_BACKEND_RETENTION_MODEL_PAYLOAD_DAYS:-30}
  EDGAR_BACKEND_RETENTION_ARTIFACT_BLOB_DAYS: ${EDGAR_BACKEND_RETENTION_ARTIFACT_BLOB_DAYS:-180}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgar}
      POSTGRES_DB: ${POSTGRES_DB:-edgar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edgar} -d ${POSTGRES_DB:-edgar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: edgar-backend:latest
    restart: "no"
    environment:
      <<: *backend_env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    image: edgar-backend:latest
    restart: unless-stopped
    environment:
      <<: *backend_env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - artifacts:/var/lib/edgar/artifacts
      - run_workspaces:/var/lib/edgar/run_workspaces
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/v1/health\")"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: .
    image: edgar-backend:latest
    restart: unless-stopped
    environment:
      <<: *backend_env
      # Process-local job activity gauges (optional scrape: host port → container 9100)
      EDGAR_BACKEND_WORKER_METRICS_PORT: "9100"
    ports:
      - "${WORKER_METRICS_PORT:-9100}:9100"
    volumes:
      - artifacts:/var/lib/edgar/artifacts
      - run_workspaces:/var/lib/edgar/run_workspaces
    command: ["python", "-m", "backend.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  retention:
    build: .
    image: edgar-backend:latest
    restart: unless-stopped
    environment:
      <<: *backend_env
    volumes:
      - artifacts:/var/lib/edgar/artifacts
      - run_workspaces:/var/lib/edgar/run_workspaces
    # Compose has no native cron: apply retention, then sleep. Interval is substituted at
    # `compose up` time (override EDGAR_BACKEND_RETENTION_INTERVAL_SECONDS in .env; default 24h).
    # `--apply` is a safe no-op when every EDGAR_BACKEND_RETENTION_*_DAYS tier is 0.
    command:
      - sh
      - -c
      - "while true; do python -m backend.maintenance.retention --apply --json || true; sleep ${EDGAR_BACKEND_RETENTION_INTERVAL_SECONDS:-86400}; done"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    image: edgar-web:latest
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  artifacts:
  run_workspaces:
